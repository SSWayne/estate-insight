<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#132238">
  <!-- 加入主畫面（PWA） -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="雙北購屋">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Estate Insight｜雙北購屋分析</title>
  <meta name="description" content="台北市與新北市自住購屋分析：物件管理、房價統計、物件比較、房貸試算">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23132238'/%3E%3Cpath d='M8 15l8-6 8 6v9H8z' fill='none' stroke='%23c8a46a' stroke-width='2.2' stroke-linejoin='round'/%3E%3C/svg%3E">

  <!-- 字型（外部，離線時改用系統字型「微軟正黑體」） -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap">

  <link rel="stylesheet" href="css/styles.css">

  <!-- 第三方依賴（集中於 /vendor，詳見 README「依賴管理」） -->
  <script src="vendor/chart.umd.js" defer></script>
  <script src="vendor/lucide.min.js" defer></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div class="app-shell">
    <!-- 左側導覽列 -->
    <aside class="sidebar" id="sidebar" aria-label="主選單">
      <div class="sidebar-brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="22" height="22"><path d="M7 15l9-7 9 7v10H7z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/><path d="M13.5 25v-6h5v6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/></svg>
        </span>
        <div>
          <div class="brand-name">Estate Insight</div>
          <div class="brand-sub">雙北購屋分析系統</div>
        </div>
      </div>
      <nav class="sidebar-nav" id="sidebarNav"></nav>
      <div class="sidebar-foot" id="sidebarFoot">
        <div class="storage-pill" id="storageStatus">
          <span class="dot"></span><span class="txt">檢查資料庫…</span>
        </div>
      </div>
    </aside>
    <div class="sidebar-scrim" id="sidebarScrim" hidden></div>

    <!-- 右側主要區域 -->
    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menuBtn" aria-label="開啟選單" aria-controls="sidebar" aria-expanded="false">
          <i data-lucide="menu" class="icon"></i>
        </button>
        <div class="topbar-title">
          <div class="crumbs" id="crumbs">Estate Insight</div>
          <h1 id="pageTitle">Dashboard</h1>
        </div>
        <form class="topbar-search" id="globalSearch" role="search">
          <i data-lucide="search" class="icon"></i>
          <input type="search" name="q" placeholder="搜尋物件名稱或地址" aria-label="搜尋物件">
        </form>
        <a class="btn btn-gold" href="#/create" id="topbarCreate">
          <i data-lucide="plus" class="icon"></i><span>新增房屋</span>
        </a>
      </header>

      <div class="notice" id="vendorNotice" hidden></div>
      <div class="notice notice-info" id="installNotice" role="region" aria-label="加入主畫面提示" hidden></div>
      <div class="notice notice-info" id="backupNotice" role="region" aria-label="備份提醒" hidden></div>

      <main class="content" id="view" tabindex="-1"></main>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <noscript><p class="noscript">本系統需要啟用 JavaScript 才能運作。</p></noscript>
</body>
</html>
